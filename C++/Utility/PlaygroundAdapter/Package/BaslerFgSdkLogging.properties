# Framegrabber-owned Basler Frame Grabber SDK logging policy.
# A user-supplied BASLER_FGSDK_LOGGING_CONFIG takes precedence over this file.
log4j.rootCategory=NOTICE, stdout
log4j.category.FgSdk=NOTICE

# Sgc_connectCamera probes optional GenICam nodes. Some Basler cameras report
# unsupported optional nodes through this category even when connection and
# acquisition are successful. Feature-operation failures remain API return values.
log4j.category.FgSdk.genicam.lib=FATAL

log4j.category.FgSdk.fglib.Acq=FATAL
log4j.category.FgSdk.GenTL.Acq=FATAL
log4j.category.FgSdk.fglib.Events=FATAL

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d:%t:%c] %p: %m%n
